<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="An adaptive idea refinement workspace inspired by GStack office-hours and Grill Me questioning.">
    <title>ForgeRoom - Adaptive Idea Refinement</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="Idea refinement workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">ForgeRoom</p>
            <h1>Pressure-test an idea until it becomes buildable.</h1>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" id="resetButton" type="button" title="Reset session" aria-label="Reset session">
              <span aria-hidden="true">↺</span>
            </button>
            <button class="primary-button" id="exportButton" type="button">Export Brief</button>
          </div>
        </header>

        <section class="mode-panel" aria-label="Coach settings">
          <div class="segmented-control" aria-label="Idea mode">
            <button class="mode-button" id="startupModeButton" type="button" data-mode="startup">Startup</button>
            <button class="mode-button" id="builderModeButton" type="button" data-mode="builder">Builder</button>
          </div>
          <label class="toggle-row" for="aiToggle">
            <input id="aiToggle" type="checkbox" checked>
            <span>Adaptive AI coach</span>
          </label>
          <span class="api-pill" id="apiStatus">Checking coach</span>
        </section>

        <section class="stage-strip" id="stageStrip" aria-label="Refinement stages"></section>

        <section class="question-panel" aria-live="polite">
          <p class="save-status" id="saveStatus" role="status"></p>
          <div class="question-meta">
            <span id="currentStage">Stage</span>
            <span id="questionCount">Question 1</span>
          </div>
          <h2 id="questionTitle"></h2>
          <p id="questionWhy"></p>
          <div class="recommended-answer">
            <div class="recommended-header">
              <span>Recommended answer shape</span>
              <button id="useRecommendationButton" type="button">Use as starter</button>
            </div>
            <p id="recommendedAnswer"></p>
          </div>
          <div class="coach-note" id="coachNoteBlock" hidden>
            <span>Coach read</span>
            <p id="coachNoteText"></p>
          </div>
          <label class="answer-label" for="answerInput">Your answer</label>
          <textarea id="answerInput" rows="7" placeholder="Write plainly. Specific beats impressive."></textarea>
          <div class="previous-answer" id="previousAnswerBlock" hidden>
            <span>Previous answer saved</span>
            <p id="previousAnswerText"></p>
          </div>
          <div class="question-actions">
            <button id="backButton" class="secondary-button" type="button">Back</button>
            <button id="nextButton" class="primary-button" type="button">Save & Next</button>
          </div>
        </section>
      </section>

      <aside class="brief-panel" aria-label="Live idea brief">
        <div class="brief-header">
          <p class="eyebrow">Live Brief</p>
          <span id="completionMeter">0%</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="progressBar"></span>
        </div>
        <section class="brief-section">
          <h2>Idea Core</h2>
          <dl id="ideaCore"></dl>
        </section>
        <section class="brief-section">
          <h2>Answer Trail</h2>
          <ol id="answerTrail"></ol>
        </section>
        <section class="brief-section">
          <h2>Decision Pressure</h2>
          <ul id="pressureList"></ul>
        </section>
        <section class="brief-section" id="premiseSection" hidden>
          <h2>Premise Challenge</h2>
          <p id="premiseChallenge"></p>
        </section>
        <section class="brief-section" id="alternativesSection" hidden>
          <h2>Alternatives</h2>
          <ol id="alternativesList"></ol>
        </section>
      </aside>
    </main>

    <dialog id="exportDialog">
      <form method="dialog">
        <div class="dialog-header">
          <h2>Exportable Design Brief</h2>
          <button class="icon-button" value="cancel" aria-label="Close export dialog">×</button>
        </div>
        <textarea id="exportOutput" rows="18" readonly></textarea>
        <div class="dialog-actions">
          <button class="secondary-button" id="copyExportButton" type="button">Copy</button>
          <button class="primary-button" value="cancel">Done</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
